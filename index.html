<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Target Turnover (TO)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            margin: 0 auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f8f5;
            border-left: 5px solid #27ae60;
            border-radius: 4px;
            display: none;
        }
        .result-title {
            font-weight: bold;
            font-size: 18px;
            color: #117a65;
            margin-bottom: 15px;
            border-bottom: 1px dashed #117a65;
            padding-bottom: 5px;
        }
        .step-box {
            background-color: #ffffff;
            border: 1px solid #d1f2eb;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.6;
            color: #2c3e50;
            white-space: pre-line;
            margin-bottom: 15px;
        }
        .highlight {
            font-weight: bold;
            color: #c0392b;
        }
        .note {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Bonus & Turnover</h2>
    
    <div class="form-group">
        <label for="jenisDeposit">Pilih Jenis Deposit:</label>
        <select id="jenisDeposit" onchange="hitungTO()">
            <option value="1">DEPOSIT PERTAMA (100% Max 1.000)</option>
            <option value="2">DEPOSIT KEDUA (20% Max 500)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nominalInput">Nominal Deposit (Dalam Poin):</label>
        <input type="number" id="nominalInput" placeholder="Contoh: 1624" min="1" oninput="hitungTO()">
        <div class="note">* 1 Poin = Rp 1.000 (Contoh: 1.000 Poin = Rp 1.000.000)</div>
    </div>

    <button onclick="hitungTO()">HITUNG SEKARANG</button>

    <div id="resultBox" class="result-box">
        <div class="result-title" id="resTipe">Hasil Perhitungan</div>
        
        <!-- Kotak Rincian Langkah Sesuai Permintaan -->
        <div class="step-box" id="resLangkahPerhitungan"></div>

        <div style="font-size: 14px; color: #555; border-top: 1px solid #d1f2eb; padding-top: 10px;">
            <strong>Konversi Nilai Rupiah (Rp):</strong><br>
            • Deposit: <span id="resDepoRupiah">Rp0</span><br>
            • Bonus: <span id="resBonusRupiah">Rp0</span><br>
            • Target TO: <span id="resToRupiah" class="highlight">Rp0</span>
        </div>
    </div>
</div>

<script>
    function formatRupiah(angka) {
        return "Rp " + Math.round(angka).toLocaleString('id-ID');
    }

    function hitungTO() {
        const jenis = document.getElementById("jenisDeposit").value;
        const depoInput = parseFloat(document.getElementById("nominalInput").value);
        const resultBox = document.getElementById("resultBox");

        if (isNaN(depoInput) || depoInput <= 0) {
            resultBox.style.display = "none";
            return;
        }

        let bonus = 0;
        let targetTO = 0;
        let tipeTeks = "";
        let teksLangkah = "";

        if (jenis === "1") {
            tipeTeks = "DEPOSIT PERTAMA (100% Max 1.000)";
            
            if (depoInput <= 1000) {
                bonus = Math.round(depoInput * 1.0);
                targetTO = (depoInput + bonus) * 8;
                
                teksLangkah = `(${depoInput} + ${bonus}) x 8 = ${targetTO.toLocaleString('id-ID')} TO\nJumlah bonus yang di dapat ${bonus}`;
            } else {
                bonus = 1000;
                let sisaKelebihan = depoInput - 1000;
                targetTO = 16000 + (sisaKelebihan * 1);
                
                teksLangkah = `(1000 + 1000) x 8\n16.000 + (${sisaKelebihan} x 1) = ${targetTO.toLocaleString('id-ID')} TO\nJumlah bonus yang di dapat ${bonus}`;
            }
        } else if (jenis === "2") {
            tipeTeks = "DEPOSIT KEDUA (20% Max 500)";
            
            if (depoInput <= 2500) {
                // Aturan pembulatan koma (0.5 ke atas, 0.4 ke bawah) dilakukan otomatis oleh Math.round
                bonus = Math.round(depoInput * 0.2); 
                targetTO = (depoInput + bonus) * 8;
                
                teksLangkah = `(${depoInput} + ${bonus}) x 8 = ${targetTO.toLocaleString('id-ID')} TO\nJumlah bonus yang di dapat ${bonus}`;
            } else {
                bonus = 500;
                let sisaKelebihan = depoInput - 2500;
                targetTO = 24000 + (sisaKelebihan * 1);
                
                teksLangkah = `(2500 + 500) x 8\n24.000 + (${sisaKelebihan} x 1) = ${targetTO.toLocaleString('id-ID')} TO\nJumlah bonus yang di dapat ${bonus}`;
            }
        }

        // Tampilkan data ke elemen HTML
        document.getElementById("resTipe").innerText = tipeTeks;
        document.getElementById("resLangkahPerhitungan").innerText = teksLangkah;
        
        // Tampilkan konversi rupiah di bawahnya
        document.getElementById("resDepoRupiah").innerText = formatRupiah(depoInput * 1000);
        document.getElementById("resBonusRupiah").innerText = formatRupiah(bonus * 1000);
        document.getElementById("resToRupiah").innerText = formatRupiah(targetTO * 1000);

        resultBox.style.display = "block";
    }
</script>

</body>
</html>
